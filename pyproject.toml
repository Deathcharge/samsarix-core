[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samsarix-core"
version = "2.0.0a2"
description = "A small, dependency-free runtime for typed local Python tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE", "TRADEMARKS.md"]
authors = [
  { name = "Samsarix LLC", email = "contact@samsarix.com" },
]
maintainers = [
  { name = "Samsarix LLC", email = "support@samsarix.com" },
]
keywords = ["tools", "agents", "runtime", "asyncio", "json-schema", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "black>=24.10,<27",
  "build>=1.2,<2",
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "twine>=6.2,<7",
]

[project.urls]
Homepage = "https://samsarix.com"
Repository = "https://github.com/Deathcharge/samsarix-core"
Issues = "https://github.com/Deathcharge/samsarix-core/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["samsarix_core*", "helix_core*"]

[tool.setuptools.package-data]
samsarix_core = ["py.typed"]
helix_core = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "^/legacy/"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/samsarix_core", "src/helix_core", "examples", "benchmarks"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=samsarix_core --cov-branch --cov-report=term-missing --cov-fail-under=90"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
