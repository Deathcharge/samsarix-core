name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Require the tag to point to the default branch head
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}" --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${DEFAULT_BRANCH}")"
      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2,<2" "twine>=6.2,<7"
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Smoke-test the wheel
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install --no-deps dist/*.whl
          .release-smoke/bin/python -c "from samsarix_core import MCPServer, ToolPolicyContext, ToolPolicyDecision, ToolRuntime, serve_stdio, __version__; print(__version__)"
          .release-smoke/bin/python -c "from helix_core import MCPServer, ToolPolicyContext, ToolPolicyDecision, serve_stdio, __version__ as legacy_version; from samsarix_core import __version__; assert legacy_version == __version__, f'{legacy_version} != {__version__}'"
      - name: Require the tag to match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          .release-smoke/bin/python -c "import os; from samsarix_core import __version__; expected = f'v{__version__}'; actual = os.environ['RELEASE_TAG']; assert actual == expected, f'{actual} does not match {expected}'"
      - name: Generate checksums
        run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Attest release distributions
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=(--latest=false)
          if [[ "${GITHUB_REF_NAME}" =~ (a|b|rc|dev)[0-9]+$ ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --verify-tag --generate-notes --title "Samsarix Core ${GITHUB_REF_NAME}" --notes "Installable GitHub distribution with SHA-256 checksums and GitHub Actions build-provenance attestations. This release is not published to PyPI." "${release_flags[@]}"
