name: Feature request
description: Propose a focused improvement to the typed local-tool runtime.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the concrete user need before describing a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest API or behavior change that would address the need.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note current workarounds or approaches that did not fit.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request fits a local, provider-neutral tool declaration or execution runtime.
          required: true
